# Gitea Actions reusable lint (call from same instance after mirror).
# Example consumer:
#   jobs:
#     Lint:
#       uses: b4m-inner/workflows/.gitea/workflows/lint.yaml@v1
name: Reusable lint

on:
  workflow_call:
    inputs:
      working_directory:
        description: Repository subdirectory for lint
        type: string
        required: false
        default: "."

jobs:
  Lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/ci/lint.sh
        run: |
          set -euo pipefail
          if [ -x scripts/ci/lint.sh ]; then
            ./scripts/ci/lint.sh
          elif [ -f scripts/ci/lint.sh ]; then
            bash scripts/ci/lint.sh
          else
            echo "No scripts/ci/lint.sh — lint no-op (convention)."
          fi
